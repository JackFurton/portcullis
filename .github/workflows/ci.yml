name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      - name: Coverage
        run: go tool cover -func=cover.out | tail -1
      # Compile and run every benchmark once, so they cannot rot unnoticed.
      - run: go test ./... -run XXX -bench . -benchtime 1x

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # A short run on every push. It is not long enough to find something
      # deep, and it is long enough that a change which breaks one of these
      # properties outright does not get merged. The first run of these targets
      # found three real issues in under three minutes.
      - name: Path normalization
        run: go test ./internal/policy -run Fuzz -fuzz FuzzNormalizePath -fuzztime 60s
      - name: Token parsing
        run: |
          go test ./internal/token -run Fuzz -fuzz FuzzPeekIssuer -fuzztime 30s
          go test ./internal/token -run Fuzz -fuzz FuzzBearerToken -fuzztime 30s
          go test ./internal/token -run Fuzz -fuzz FuzzParseSigned -fuzztime 30s
      - name: Report any crash the run found
        if: failure()
        run: |
          echo "A fuzz target failed. The input is under testdata/fuzz; commit it as a regression case."
          find . -path '*/testdata/fuzz/*' -type f -print -exec cat {} \;

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Built from source with this repo's toolchain rather than pulled as a
      # prebuilt binary. The published builds target an older Go than go.mod
      # does, which golangci-lint refuses to run against, and building it here
      # also means CI and "make lint" cannot disagree.
      - run: make lint

  policy:
    name: Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The policy is the security control. A broken one should fail here
      # rather than during a rollout.
      - run: make check-policy

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Brings up Envoy, this service, an identity provider and an upstream,
      # then asserts every allow and deny. It is the check that catches a
      # change turning a denial into an allow.
      - run: ./hack/smoke.sh
      - if: always()
        run: docker compose -f deploy/docker/docker-compose.yaml down -v
