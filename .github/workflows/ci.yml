name: CI

on:
  push:
  pull_request:

permissions: {}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -coverprofile=cover.out ./...
      - name: Coverage
        run: go tool cover -func=cover.out | tail -1

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # v2 of golangci-lint needs v7 or newer of this action.
      - uses: golangci/golangci-lint-action@v7
        with:
          version: v2.6.2

  policy:
    name: Policy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The policy is the security control. A broken one should fail here
      # rather than during a rollout.
      - run: make check-policy

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      # Brings up Envoy, this service, an identity provider and an upstream,
      # then asserts every allow and deny. It is the check that catches a
      # change turning a denial into an allow.
      - run: ./hack/smoke.sh
      - if: always()
        run: docker compose -f deploy/docker/docker-compose.yaml down -v
