# Envoy in front of the echo upstream, calling portcullis for every request.
admin:
  address:
    socket_address: {address: 0.0.0.0, port_value: 9901}

static_resources:
  listeners:
    - name: ingress
      address:
        socket_address: {address: 0.0.0.0, port_value: 10000}
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http

                # Normalize before the authorization filter runs, so the path
                # portcullis matches on is the path the router will use.
                # portcullis rejects the same shapes independently: this is the
                # kind of check that should not depend on one config field in
                # one proxy staying set.
                normalize_path: true
                merge_slashes: true
                path_with_escaped_slashes_action: REJECT_REQUEST

                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        json_format:
                          method: "%REQ(:METHOD)%"
                          path: "%REQ(:PATH)%"
                          status: "%RESPONSE_CODE%"
                          flags: "%RESPONSE_FLAGS%"
                          # Published by portcullis as dynamic metadata, so
                          # the access log records who was allowed without
                          # parsing the token a second time.
                          rule: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:rule)%"
                          reason: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:reason)%"
                          tenant: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:tenant)%"
                          subject: "%DYNAMIC_METADATA(envoy.filters.http.ext_authz:subject)%"

                route_config:
                  name: local
                  virtual_hosts:
                    - name: default
                      domains: ["*"]
                      routes:
                        - match: {prefix: "/"}
                          route: {cluster: echo}

                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      # If portcullis is unreachable, requests are refused.
                      # The service has its own failureMode for decisions it
                      # cannot reach; this covers not reaching the service.
                      failure_mode_allow: false
                      grpc_service:
                        envoy_grpc:
                          cluster_name: portcullis
                        timeout: 0.5s
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: echo
      type: STRICT_DNS
      connect_timeout: 1s
      load_assignment:
        cluster_name: echo
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: echo, port_value: 8080}

    - name: portcullis
      type: STRICT_DNS
      connect_timeout: 1s
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: portcullis
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: {address: portcullis, port_value: 9191}
